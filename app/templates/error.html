{% extends "base.html" %}
{% block title %}{{ status_code }} {{ title }}{% endblock %}
{% block content %}

<div style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--accent-light); opacity: 0.4;">
        {{ status_code }}
    </div>
    <h1 style="font-size: 1.75rem; margin: 0.5rem 0;">{{ title }}</h1>
    <p style="color: var(--text-dim); max-width: 560px; margin: 1rem auto 2rem;">
        {{ message }}
    </p>
    {% if detail %}
    <div class="card" style="max-width: 560px; margin: 0 auto 2rem; text-align: left;">
        <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em;">상세</div>
        <pre style="margin-top: 0.5rem; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; color: var(--text-dim);">{{ detail }}</pre>
    </div>
    {% endif %}
    <div>
        <a href="/" class="btn">대시보드로</a>
        <a href="javascript:history.back()" class="btn btn-outline" style="margin-left: 0.5rem;">뒤로</a>
    </div>
</div>

{% endblock %}
