<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ISMS-P 문서 관리{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --text-dim: #9ca3af;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-light);
            text-decoration: none;
        }
        .nav-brand span { color: var(--text-dim); font-weight: 400; font-size: 0.85rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
        }
        .stat-card .label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
        .stat-card .value.green { color: var(--green); }
        .stat-card .value.yellow { color: var(--yellow); }
        .stat-card .value.red { color: var(--red); }
        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar button, .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .search-bar button:hover, .btn:hover { background: var(--accent-light); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent-light); }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--surface);
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.04em;
            position: sticky;
            top: 0;
        }
        tr:hover { background: rgba(99, 102, 241, 0.05); }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-ok { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-warn { background: rgba(239,68,68,0.15); color: var(--red); }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h3 { color: var(--accent-light); margin-bottom: 0.75rem; font-size: 1rem; }
        .card ul { list-style: none; }
        .card ul li { padding: 0.35rem 0; color: var(--text-dim); font-size: 0.9rem; }
        .card ul li::before { content: "→ "; color: var(--accent); }
        .tag {
            display: inline-block;
            background: rgba(99,102,241,0.12);
            color: var(--accent-light);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.78rem;
            margin-right: 0.3rem;
        }
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 0.35rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .back-link { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-light); }
        .section-title { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.25rem; }
        .item-code { font-family: monospace; color: var(--accent-light); }
        a.row-link { color: var(--text); text-decoration: none; }
        a.row-link:hover { color: var(--accent-light); }
        .evidence-list { margin-top: 0.5rem; }
        .evidence-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .evidence-item .meta { font-size: 0.78rem; color: var(--text-dim); }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">ISMS-P <span>문서 관리</span></a>
        <a href="/documents" class="nav-link" style="color:var(--text-dim);text-decoration:none;font-size:0.9rem;">문서 관리</a>
        <a href="/mappings" class="nav-link" style="color:var(--text-dim);text-decoration:none;font-size:0.9rem;">매핑 관리</a>
        <a href="/gap" class="nav-link" style="color:var(--text-dim);text-decoration:none;font-size:0.9rem;">갭 분석</a>
        <a href="/laws" class="nav-link" style="color:var(--text-dim);text-decoration:none;font-size:0.9rem;">법령 관리</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
