services:
  # 웹 관리 페이지 (브라우저)
  isms-web:
    build: .
    container_name: isms-p-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/data/uploads
    environment:
      - ISMS_DB_PATH=/app/data/isms_p.db
      - MAX_UPLOAD_SIZE_MB=50

  # MCP 서버 (Claude Desktop stdio)
  isms-mcp:
    build: .
    container_name: isms-p-mcp
    stdin_open: true
    command: ["python", "-m", "mcp_server.isms_mcp_server"]
    volumes:
      - ./data:/app/data
    environment:
      - ISMS_DB_PATH=/app/data/isms_p.db
